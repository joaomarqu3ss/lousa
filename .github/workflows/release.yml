name: Release

# Push a version tag only after completing the manual release checks.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: "--bundles appimage,deb,rpm"
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows-latest
            args: "--bundles nsis"
            files: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: lousa-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lousa-*
          path: artifacts
          merge-multiple: true
      - name: Publish release after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(artifacts/**/*.AppImage artifacts/**/*.deb artifacts/**/*.rpm artifacts/**/*.exe artifacts/**/*.dmg)
          for pattern in '*.AppImage' '*.deb' '*.rpm' '*.exe' '*.dmg'; do
            matches=(artifacts/**/$pattern)
            if (( ${#matches[@]} != 1 )); then
              echo "Expected exactly one artifact matching $pattern" >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --prerelease \
              --title "Lousa $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --draft \
              --title "Lousa $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
